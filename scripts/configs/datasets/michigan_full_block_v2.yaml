dataset_name: MICHIGAN_FULL_BLOCK
# Q1: full-block windowing (no crop) run on the ORIGINAL, uncorrected data --
# processed_output_v2 -- rather than processed_output_sub_voxel_norm.
#
# IMPORTANT: processed_output_v2 only has the global per-subject scalar
# normalization (see project doc section 15). That's the exact per-subject
# "spatial fingerprint" confound that was diagnosed as the reason every run
# on this data plateaued at chance, regardless of window/trim settings --
# switching to a full, uncropped block does not touch that confound at all.
# Expect this run to reproduce the same chance-level / collapsed-prediction
# behavior seen in earlier v2 runs. It's a legitimate comparison to make
# (e.g. to double check the confound persists independent of windowing),
# just going in with that expectation.
image_path: /data/margo_datasets/Michigan_Dataset_1_for_NeuroSTORM/processed_output_v2

tasks:
  task6:
    downstream_task_id: 6
    task_name: imagery_task_classification
    downstream_task_type: classification
    num_classes: 3

defaults:
  split_root: ./nas/splits
  dataset_split_num: 1
  limit_training_samples: 1.0
  # Same starting value as michigan_full_block.yaml -- the block spans
  # (37-38 TR) come from timing_onehot_task1.tsv, which is identical
  # regardless of which normalization was applied to the voxel values.
  # Confirm/replace empirically the same way (see michigan_full_block.yaml).
  sequence_length_override: 37
  img_size_override: [96, 96, 96, 37]
