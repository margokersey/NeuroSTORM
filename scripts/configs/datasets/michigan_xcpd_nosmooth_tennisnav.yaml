dataset_name: MICHIGAN_TENNIS_NAV
# 2-class version of michigan_xcpd_nosmooth_fullblock: tennis (0) vs navigation (1),
# squeeze blocks dropped (10 + 10 blocks per subject). Same data, 37-TR full-block
# windows, splits (nas/splits/MICHIGAN/, LOOCV folds 101..126) and hyperparameters.
# Binary head (one logit, BCE) as in the Task-vs-NoTask stage.
image_path: /nfs/turbo/umms-huanglab/mkersey/Michigan_Dataset_1_for_NeuroSTORM/FIXED_xcp_nosmooth_task-imagery_run-1

tasks:
  task8:
    downstream_task_id: 8
    task_name: tennis_vs_nav_classification
    downstream_task_type: classification
    num_classes: 2

defaults:
  split_root: ./nas/splits
  dataset_split_num: 1
  limit_training_samples: 1.0
  sequence_length_override: 37
  img_size_override: [96, 96, 96, 37]
