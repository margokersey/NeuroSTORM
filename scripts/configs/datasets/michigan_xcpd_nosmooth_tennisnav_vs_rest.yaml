dataset_name: MICHIGAN_TENNISNAV_VS_REST
# Stage A of the tennis/navigation two-stage decoding test: Task vs. No Task.
#   Task    = the 20 tennis + navigation blocks of task-imagery_run-1 (squeeze
#             blocks dropped; same 37-TR windows as michigan_xcpd_nosmooth_tennisnav)
#   No Task = 10 mock blocks from task-rest_run-1 + 10 from task-rest_run-2,
#             cut at the onsets of the first 10 tennis/navigation blocks.
#             See MichiganTennisNavVsRest in datasets/fmri_datasets.py.
# Binary head, same task_name (and metrics) as michigan_xcpd_nosmooth_taskvsrest.
# image_path is the IMAGERY run-1 root; the rest roots are derived from it.
# Splits are shared with the 3-way task (MICHIGAN/, LOOCV folds 101..126).
image_path: /nfs/turbo/umms-huanglab/mkersey/Michigan_Dataset_1_for_NeuroSTORM/FIXED_xcp_nosmooth_task-imagery_run-1

tasks:
  task9:
    downstream_task_id: 9
    task_name: taskvsrest_classification
    downstream_task_type: classification
    num_classes: 2

defaults:
  split_root: ./nas/splits
  dataset_split_num: 1
  limit_training_samples: 1.0
  sequence_length_override: 37
  img_size_override: [96, 96, 96, 37]
