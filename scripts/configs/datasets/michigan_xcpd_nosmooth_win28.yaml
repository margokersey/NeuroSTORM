dataset_name: MICHIGAN
# XCP-D-denoised reprocessing of the same task-imagery_run-1 recordings as
# michigan.yaml: same 26 subjects, same block/task labels (tennis/navigation/
# squeeze via timing_onehot_task1.tsv), same Michigan dataset class, and the
# SAME nas/splits/MICHIGAN/split_fixed_N.txt split files -- dataset_name is
# left as MICHIGAN on purpose (only image_path changes) so training reuses
# the existing fMRIPrep-run splits/class/task wiring untouched.
#
# ("michigan_xcpd" was only ever the PREPROCESSING-time dataset_name passed
# to preprocessing_volume.py / patch_add_michigan_xcpd.py, used to select
# the XCP-D filename regex + cross-directory mask lookup while generating
# these data.pt files. It has no relationship to this file's dataset_name
# field, which is what main.py/data_module.py actually train against.)
image_path: /data/margo_datasets/Michigan_Dataset_1_for_NeuroSTORM/FIXED_xcp_nosmooth_task-imagery_run-1

tasks:
  task6:
    downstream_task_id: 6
    task_name: imagery_task_classification
    downstream_task_type: classification
    num_classes: 3
  # Subject re-identification: classify WHICH of the 26 subjects a window
  # came from instead of which task block it was, reusing the exact same
  # task-imagery_run-1 windows and the exact same
  # nas/splits/MICHIGAN/split_fixed_1..5.txt 5-fold CV splits as task6 --
  # see patch_michigan_reid.py (datasets/data_module.py's MICHIGAN branch +
  # Michigan._set_data in datasets/fmri_datasets.py) for how the subject-id
  # labeling works. num_classes below is a placeholder: main.py overrides
  # it at runtime to the real subject count (26) once the data module has
  # built its subject dict (see "ReID task: num_classes set to N" in the
  # run log). Checkpointing for this task_name uses valid_reid_top1
  # (embedding-retrieval accuracy), not valid_acc.
  task4:
    downstream_task_id: 4
    task_name: fmri_reid
    downstream_task_type: classification
    num_classes: 26

defaults:
  split_root: ./nas/splits
  dataset_split_num: 1
  limit_training_samples: 1.0
  # Block boundaries come from timing_onehot_task1.tsv, which is identical
  # regardless of preprocessing pipeline -- no need to re-derive this.
  sequence_length_override: 28
  img_size_override: [96, 96, 96, 28]
